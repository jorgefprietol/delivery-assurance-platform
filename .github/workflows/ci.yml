name: Delivery pipeline
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: node --check app/static/app.js
      - run: pytest
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.lock --strict --format json --output artifacts/dependency-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-evidence
          path: artifacts/
          retention-days: 30
  container:
    name: Container acceptance
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated workspace
        run: |
          echo "API_KEY=$(openssl rand -hex 32)" > .env
          echo "APP_PORT=18130" >> .env
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: HTTP acceptance against the container
        run: |
          set -a
          source .env
          set +a
          python -m scripts.smoke
      - name: Verify persistence across restart
        run: |
          set -a
          source .env
          set +a
          curl -fsS -H "X-API-Key: $API_KEY" http://127.0.0.1:18130/api/projects > /tmp/projects-before.json
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          curl -fsS -H "X-API-Key: $API_KEY" http://127.0.0.1:18130/api/projects > /tmp/projects-after.json
          diff /tmp/projects-before.json /tmp/projects-after.json
      - name: Container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/container.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-evidence
          path: artifacts/
      - run: docker compose down -v
        if: always()
  publish:
    name: Publish verified image
    needs: [quality, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "immutable=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            echo "moving=$image:$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "moving=$image:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.immutable }}
            ${{ steps.tags.outputs.moving }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Verified image digest = $DIGEST" >> "$GITHUB_STEP_SUMMARY"
