services:
  delivery:
    build: .
    image: delivery-assurance-platform:local
    ports:
      - "127.0.0.1:${APP_PORT:-18140}:8080"
    environment:
      ENGINEER_ID: ${ENGINEER_ID:-jorge-prieto}
      ENGINEER_API_KEY: ${ENGINEER_API_KEY:?Run scripts/setup.ps1}
      REVIEWER_ID: ${REVIEWER_ID:-release-reviewer}
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:?Run scripts/setup.ps1}
      DATABASE_PATH: /data/delivery.db
    volumes:
      - delivery-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
volumes:
  delivery-data:
networks:
  default:
    ipam:
      config:
        - subnet: ${DELIVERY_SUBNET:-10.254.120.0/28}
